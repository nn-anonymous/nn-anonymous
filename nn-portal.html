<style>:root{color-scheme:dark;--bg:#071127;--panel:rgba(18,36,75,.92);--panel2:rgba(12,28,59,.95);--line:rgba(172,205,255,.19);--text:#f3f7ff;--muted:#c0d0eb;--blue:#86b1ff;--mint:#a5efd3;--purple:#c6b1ff;--radius:21px}
*{box-sizing:border-box}html{scroll-behavior:smooth}[hidden]{display:none!important}body{min-height:100svh;margin:0;color:var(--text);font:16px/1.75 -apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;background:radial-gradient(ellipse at 10% 0%,#244788 0,transparent 40%),radial-gradient(ellipse at 95% 45%,#392b73 0,transparent 42%),var(--bg)}a{color:inherit}button,input{font:inherit}button{cursor:pointer}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #c3dcff;outline-offset:3px}.wrap{width:min(100% - 36px,1020px);margin:auto;padding:26px 0 65px}.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}.brand{font-size:1.12rem;font-weight:950;letter-spacing:.03em;text-decoration:none}.brand span{display:block;font-size:.66rem;letter-spacing:.17em;color:#a4c5ff;font-weight:800;margin-top:-3px}.tag{border:1px solid var(--line);color:#dfebff;border-radius:99px;padding:4px 12px;font-size:.76rem;background:#243b68}.hero{padding:54px 0 29px}.eyebrow{font-size:.73rem;color:var(--mint);font-weight:800;letter-spacing:.13em}.hero h1{margin:8px 0 15px;line-height:1.22;font-size:clamp(2.02rem,6.4vw,3.3rem);letter-spacing:.012em;text-wrap:balance}.hero p{margin:0;max-width:720px;color:var(--muted);font-size:clamp(.94rem,2.5vw,1.05rem);line-height:1.9;text-wrap:pretty}.highlights{display:flex;gap:10px;flex-wrap:wrap;margin:21px 0 0}.highlight{font-size:.8rem;color:#e6edff;background:#1c3563;border:1px solid var(--line);padding:5px 11px;border-radius:99px}.primary-links{display:flex;flex-wrap:wrap;gap:11px;margin:27px 0 12px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:49px;padding:11px 17px;border-radius:13px;text-decoration:none;background:#234577;border:1px solid #628bd0;color:#fff;font-weight:800;font-size:.92rem}.btn.primary{background:linear-gradient(125deg,#2777e6,#7954de);border-color:transparent;box-shadow:0 8px 28px #1c4bbc40}.btn:hover{filter:brightness(1.1)}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:35px 0 8px}.search{width:min(100%,390px);border:1px solid #6386be;background:#0b1d41;color:var(--text);border-radius:13px;padding:11px 15px;min-height:46px}.search::placeholder{color:#b3c5df}.count{font-size:.85rem;color:#d5e3fc;margin:10px 0 0}.section{margin:28px 0 34px}.sectionhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:15px}.sectionhead h2{font-size:1.3rem;line-height:1.4;letter-spacing:.01em;margin:0}.sectionhead small{color:var(--muted);font-size:.8rem}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{display:flex;align-items:center;gap:15px;text-decoration:none;background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--radius);padding:21px;min-height:115px;transition:border-color .2s,transform .2s;min-width:0}.card:hover{border-color:var(--blue);transform:translateY(-2px)}.card .icon{display:grid;place-items:center;flex:none;font-size:1.5rem;width:47px;height:47px;border-radius:14px;background:#284a86}.card .body{min-width:0;flex:1}.card .title{font-size:1.06rem;line-height:1.55;font-weight:850;overflow-wrap:anywhere}.card .desc{margin-top:5px;font-size:.83rem;line-height:1.65;color:var(--muted);overflow-wrap:anywhere}.card .arrow{color:#b8d1ff;align-self:start;margin-top:4px}.notice{margin:20px 0 5px;padding:16px 19px;background:#172e57;border:1px solid #688ac1;border-radius:15px;font-size:.89rem;line-height:1.8;color:#e2ecff}.notice.error{background:#44253a;border-color:#b87393}.notice.success{background:#153c38;border-color:#468e7b}.foot{border-top:1px solid var(--line);margin-top:44px;padding-top:20px;text-align:center;color:#aebedd;font-size:.77rem;line-height:2}.foot a{color:#c6dcff}.empty{padding:25px 19px;border:1px dashed #698ac3;border-radius:18px;color:var(--muted);margin-top:15px}.signout{background:#233d69;color:#fff;border:1px solid #6b8ec1;border-radius:12px;padding:8px 13px;min-height:42px;display:none}.signout.show{display:inline-flex}.admin-meta{margin-top:16px;color:#a9edce;font-size:.82rem}
@media(max-width:650px){.wrap{width:min(100% - 30px,1020px)}.hero{padding:39px 0 16px}.cards{grid-template-columns:1fr}.card{padding:18px;min-height:102px}.toolbar{align-items:stretch}.search{width:100%}.primary-links .btn{flex:1}.sectionhead h2{font-size:1.16rem}}@media(prefers-reduced-motion:reduce){.card{transition:none}html{scroll-behavior:auto}}

<body>
<main class="wrap">
 <header class="top"><a class="brand" href="nn-portal.html">NN匿名<span>NN ANONYMOUS</span></a><span class="tag">投稿者入口</span></header>
 <section class="hero" aria-labelledby="pageTitle">
  <div class="eyebrow">WELCOME · NN ANONYMOUS</div><h1 id="pageTitle">NN匿名<br>投稿者快捷中心</h1><p>想說的話，從這裡開始。你可以匿名投稿，也能閱讀已通過審核的公開貼文；無須提供 Instagram 帳號。</p>
  <div class="highlights"><span class="highlight">✉️ 自由分享</span><span class="highlight">📣 公開投稿</span><span class="highlight">🛡️ 尊重匿名</span></div>
  <div class="primary-links"><a class="btn primary" href="submit.html">✉️ 開始投稿</a><a class="btn" href="posts.html">📣 查看公開貼文</a></div>
 </section>
 <p class="notice" id="notice" role="status" aria-live="polite">正在載入最新入口設定……</p>
 <div class="toolbar"><input id="search" class="search" type="search" autocomplete="off" aria-label="搜尋入口" placeholder="搜尋投稿、公開貼文、首頁"/><span id="count" class="count" role="status">—</span></div>
 <div id="sections"></div><div class="empty" id="empty" hidden>找不到符合的入口，請換個關鍵字。</div>
 <footer class="foot">
  © 2026 NN匿名 · V1.4 · 投稿者專用<br>
NN匿名為獨立經營的匿名交流平台<br>
本平台由黑熊工作室提供<br>
匿名投稿仍須遵守相關法律與平台規則
</footer>
</main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://skasotsajckswovqhbeo.supabase.co','sb_publishable_k81-D28G-ipWmKVRwX2zpg_7y_xMvLX',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const $=id=>document.getElementById(id);
let links=[];
function setNotice(message,kind=''){const n=$('notice');n.textContent=message;n.className='notice '+kind;n.hidden=false;}
function safeHref(href){if(typeof href!=='string')return null;if(/^[a-z0-9][a-z0-9_-]*\.html$/.test(href))return href;try{const u=new URL(href);if(u.protocol!=='https:'||!['github.com','supabase.com','dash.cloudflare.com'].includes(u.hostname)||u.username||u.password)return null;return u.href;}catch{return null}}
function text(tag,className,value){const e=document.createElement(tag);if(className)e.className=className;e.textContent=String(value??'');return e;}
function makeCard(link){const href=safeHref(link.href);if(!href)return null;const a=document.createElement('a');a.href=href;a.className='card';if(href.startsWith('https:')){a.target='_blank';a.rel='noopener noreferrer';}
 const ico=text('span','icon',link.icon||'🔗');ico.setAttribute('aria-hidden','true');const body=document.createElement('span');body.className='body';body.append(text('span','title',link.title),text('div','desc',link.description));const arrow=text('span','arrow','↗');arrow.setAttribute('aria-hidden','true');a.append(ico,body,arrow);return a;}
function render(){const root=$('sections');root.replaceChildren();const q=($('search')?.value||'').trim().toLocaleLowerCase('zh-TW');const matches=links.filter(x=>[x.title,x.description,x.group_name].join(' ').toLocaleLowerCase('zh-TW').includes(q));const groups=new Map();for(const link of matches){if(!groups.has(link.group_name))groups.set(link.group_name,[]);groups.get(link.group_name).push(link);}
 let shown=0;for(const [group,items] of groups){const sec=document.createElement('section');sec.className='section';const head=document.createElement('div');head.className='sectionhead';head.append(text('h2','',group),text('small','',`${items.length} 個入口`));sec.append(head);const grid=document.createElement('div');grid.className='cards';for(const link of items){const card=makeCard(link);if(card){grid.append(card);shown++}}if(grid.childElementCount){sec.append(grid);root.append(sec)}}
 $('count').textContent=`顯示 ${shown} 個入口`; $('empty').hidden=shown>0;}
$('search').addEventListener('input',render);


const fallback=[
 {group_name:'投稿服務',title:'開始匿名投稿',description:'寫下想分享的內容，完成驗證後送出。',icon:'✉️',href:'submit.html'},
 {group_name:'投稿服務',title:'查看公開投稿',description:'閱讀已通過審核並公開的貼文。',icon:'📣',href:'posts.html'},
 {group_name:'認識平台',title:'NN匿名官方首頁',description:'了解平台定位及使用方式。',icon:'🏠',href:'index.html'}
];
async function boot(){try{const{data,error}=await db.rpc('nn_public_portal_links');if(error)throw error;links=Array.isArray(data)?data:[];render();$('notice').hidden=true;}catch(e){links=fallback;render();setNotice('入口設定暫時無法同步，已顯示基本投稿入口。','');}}
boot();

</script>
</body>
</html>
