<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080f26">
<meta name="description" content="NN匿名官方投稿牆，展示經管理員審核並確認公開的匿名投稿與小編回覆。">
<title>公開投稿牆｜NN匿名</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 5%,#28488e,transparent 34%),radial-gradient(circle at 95% 90%,#423078,transparent 40%),#080f26;color:#f4f8ff;font:16px/1.8 -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}header{padding:20px max(18px,calc((100vw - 850px)/2));border-bottom:1px solid #ffffff27;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}a{color:#b7d4ff}.brand{font-size:25px;font-weight:900;color:#b4d5ff}.tag{color:#abc3e7;font-size:12px;letter-spacing:.13em}main{max-width:850px;margin:auto;padding:38px 16px 70px}h1{font-size:clamp(28px,6vw,42px);margin:0}.muted{font-size:14px;color:#b7c6e6}input{width:100%;border:1px solid #6580b1;padding:15px 18px;border-radius:14px;background:#101e3b;color:white;font:inherit;margin:21px 0}.post{padding:25px 22px;margin:18px 0;border:1px solid #ffffff34;border-radius:19px;background:#ffffff10}.number{font-weight:900;color:#b0f3d7;font-size:20px}.time{font-size:12px;color:#abc0e0}.label{font-size:13px;color:#a5ceff;font-weight:800;margin-top:17px}.content{font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere;margin:5px 0 12px;line-height:1.85}.reply{background:#122952;padding:14px 16px;border-radius:12px;border-left:3px solid #6e95ff}.notice{background:#193159;padding:15px 18px;border-radius:13px;color:#d3e3ff;margin-top:20px}footer{margin-top:50px;text-align:center;color:#94a9cd;font-size:12px}.cta{display:inline-block;text-decoration:none;background:linear-gradient(110deg,#2d83ff,#7554e9);padding:10px 19px;border-radius:13px;color:#fff;font-weight:800}#posts{min-height:80px}input:focus-visible,a:focus-visible{outline:3px solid #b4d6ff;outline-offset:2px}
</style>
</head>
<body>
<header><div><div class="brand">NN匿名</div><div class="tag">PUBLIC POSTS · 已審核公開</div></div><nav><a href="index.html">返回首頁</a>　<a href="submit.html">匿名投稿</a></nav></header>
<main><h1>公開投稿牆</h1><p class="muted">這裡只顯示經管理員審核並正式確認公開的投稿。未審核、未公開或已下架的投稿不會出現在這裡。</p><a class="cta" href="submit.html">開始匿名投稿 →</a>
<label for="search" class="visually-hidden">搜尋已公開貼文</label><input type="search" id="search" placeholder="搜尋貼文編號、內容或小編回覆" aria-label="搜尋已公開貼文">
<div id="notice" class="notice" role="status" aria-live="polite">正在讀取公開投稿……</div><section id="posts" aria-label="公開貼文清單"></section><p class="muted">匿名不代表免除法律責任。請尊重他人，不公開個人敏感資料。</p><footer>© 2026 NN匿名 · 獨立經營的匿名交流平台<br>本平台由黑熊工作室提供</footer></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://skasotsajckswovqhbeo.supabase.co','sb_publishable_k81-D28G-ipWmKVRwX2zpg_7y_xMvLX');
const $=id=>document.getElementById(id),state={items:[]};
function add(parent,tag,className,text){const e=document.createElement(tag);if(className)e.className=className;if(text!==undefined)e.textContent=text;parent.append(e);return e}
function render(){const area=$('posts');area.replaceChildren();const q=$('search').value.trim().toLocaleLowerCase();const items=state.items.filter(x=>(`#NN匿名${String(x.post_number).padStart(4,'0')} ${x.content} ${x.editor_reply}`).toLocaleLowerCase().includes(q));if(!items.length){$('notice').textContent=q?'沒有符合搜尋的公開貼文。':'目前尚無公開貼文。';return}$('notice').textContent=`顯示 ${items.length} 筆公開貼文（最多載入最新 100 筆）`;
for(const item of items){const article=add(area,'article','post');add(article,'div','number','#NN匿名'+String(item.post_number).padStart(4,'0'));add(article,'div','time',item.published_at?new Date(item.published_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false}):'');add(article,'div','label','匿名提問');add(article,'p','content',item.content||'');const box=add(article,'div','reply');add(box,'div','label','小編回覆');add(box,'p','content',item.editor_reply||'')}
}
$('search').addEventListener('input',render);
try{const{data,error}=await db.from('nn_web_posts').select('post_number,content,editor_reply,published_at').eq('status','published').order('published_at',{ascending:false}).limit(100);if(error)throw error;state.items=data||[];render()}catch(error){console.error('公開貼文讀取失敗',error);$('notice').textContent='⚠️ 暫時無法載入公開貼文，請稍後重試。'}
</script>
</body>
</html>
