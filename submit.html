
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080f26">
  <meta name="description"
        content="NN匿名｜匿名投稿平台">
  <title>系統維護中｜NN匿名</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 25px 16px;
      font-family: -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC", sans-serif;
      color: #ffffff;
      background:
        radial-gradient(
          circle at 15% 15%,
          #243e86,
          transparent 40%
        ),
        radial-gradient(
          circle at 85% 85%,
          #40266c,
          transparent 40%
        ),
        #080f26;
    }

    .container {
      width: 100%;
      max-width: 560px;
      margin: 65px auto;
      text-align: center;
    }

    .card {
      padding: 38px 24px;
      border: 1px solid #ffffff25;
      border-radius: 24px;
      background: #ffffff0d;
      box-shadow: 0 15px 50px #00000035;
    }

    .logo {
      color: #91b8ff;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .symbol {
      width: 100px;
      height: 100px;
      margin: 25px auto;
      display: grid;
      place-items: center;
      border-radius: 30px;
      font-size: 38px;
      font-weight: 900;
      background: linear-gradient(
        135deg,
        #297dff,
        #7950e8
      );
      box-shadow: 0 12px 45px #3665ff55;
    }

    .status {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 15px;
      border: 1px solid #7185b8;
      border-radius: 30px;
      color: #c3d8ff;
      background: #ffffff10;
      font-size: 12px;
      letter-spacing: 1px;
    }

    h1 {
      font-size: clamp(26px, 7vw, 34px);
      margin: 24px 0 15px;
    }

    .description {
      color: #b5c4e3;
      font-size: 15px;
      line-height: 2;
      margin: 20px auto 30px;
    }

    .notice {
      text-align: left;
      padding: 19px;
      border: 1px solid #ffffff20;
      border-radius: 16px;
      background: #101d3b;
      color: #c7d6f2;
      font-size: 13px;
      line-height: 1.9;
      margin-bottom: 28px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 17px;
      border-radius: 15px;
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 800;
      background: linear-gradient(
        135deg,
        #297dff,
        #7950e8
      );
      box-shadow: 0 10px 30px #3665ff35;
    }

    .subtext {
      margin-top: 20px;
      color: #93a8cc;
      font-size: 12px;
      line-height: 1.8;
    }

    footer {
      margin-top: 35px;
      color: #899abb;
      font-size: 12px;
      line-height: 1.9;
    }

    @media (max-width: 480px) {
      .container {
        margin-top: 35px;
      }

      .card {
        padding: 30px 20px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="card">

      <div class="logo">
        NN ANONYMOUS
      </div>

      <div class="symbol">
        NN
      </div>

      <div class="status">
        SYSTEM MAINTENANCE
      </div>

      <h1>
        匿名投稿系統維護中
      </h1>

      <p class="description">
        為了提供更安全、穩定的匿名投稿環境，
        NN匿名目前正在進行系統升級與安全防護建置。
        <br><br>
        投稿功能暫時停止開放，
        完成相關測試後將再行公告。
      </p>

      <div class="notice">
        🛠️ <strong>目前維護項目</strong>
        <br><br>
        🛡️ 防機器人驗證機制
        <br>
        ⏱️ 投稿頻率限制
        <br>
        🔐 投稿資料安全防護
        <br>
        📋 管理員審核系統優化
      </div>

      <a class="button" href="index.html">
        ← 返回 NN匿名首頁
      </a>

      <div class="subtext">
        維護期間暫不接受新的匿名投稿。<br>
        感謝你的理解與支持。
      </div>

    </section>

    <footer>
      © 2026 NN匿名<br>
      獨立經營的匿名交流平台<br>
      非任何學校或官方機構所設立
    </footer>

  </main>

</body>
</html>
