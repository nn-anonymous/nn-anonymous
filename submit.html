
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080f26">
  <title>匿名投稿｜NN匿名</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 25px 16px;
      font-family: -apple-system, BlinkMacSystemFont,
        "Noto Sans TC", sans-serif;
      color: white;
      background:
        radial-gradient(circle at 10% 10%, #243e86, transparent 40%),
        radial-gradient(circle at 90% 90%, #40266c, transparent 40%),
        #080f26;
    }

    .container {
      width: 100%;
      max-width: 560px;
      margin: 30px auto;
    }

    .back {
      display: inline-block;
      color: #a9caff;
      text-decoration: none;
      margin-bottom: 25px;
    }

    .card {
      padding: 28px 22px;
      border: 1px solid #ffffff25;
      border-radius: 24px;
      background: #ffffff0d;
      box-shadow: 0 15px 50px #00000035;
    }

    .logo {
      color: #91b8ff;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    h1 {
      font-size: 30px;
      margin: 12px 0;
    }

    .description {
      color: #b5c4e3;
      font-size: 14px;
      line-height: 1.8;
    }

    label {
      display: block;
      margin: 25px 0 10px;
      font-size: 14px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 190px;
      resize: vertical;
      padding: 16px;
      border: 1px solid #52658e;
      border-radius: 14px;
      background: #101d3b;
      color: white;
      font: inherit;
      font-size: 15px;
      line-height: 1.7;
      outline: none;
    }

    textarea:focus {
      border-color: #80adff;
    }

    textarea::placeholder {
      color: #899abb;
    }

    .counter {
      text-align: right;
      color: #9aacca;
      font-size: 12px;
      margin-top: 8px;
    }

    .notice {
      padding: 14px;
      margin-top: 20px;
      border-radius: 12px;
      background: #ffffff0b;
      color: #b9c8e5;
      font-size: 13px;
      line-height: 1.8;
    }

    .check {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-top: 20px;
      color: #d0dcf2;
      font-size: 13px;
      line-height: 1.7;
    }

    .check input {
      margin-top: 4px;
      accent-color: #639bff;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 16px;
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      background: linear-gradient(135deg, #297dff, #7950e8);
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: #17294b;
      color: #c9dcff;
      font-size: 14px;
      line-height: 1.7;
      display: none;
    }

    footer {
      text-align: center;
      color: #899abb;
      font-size: 12px;
      margin-top: 30px;
      line-height: 1.8;
    }
  </style>
</head>

<body>
  <div class="container">

    <a class="back" href="index.html">
      ← 返回 NN匿名首頁
    </a>

    <div class="card">

      <div class="logo">NN ANONYMOUS</div>

      <h1>匿名投稿</h1>

      <p class="description">
        有什麼想說的嗎？<br>
        歡迎分享你的生活、想法與故事。
      </p>

      <form id="投稿表單">

        <label for="content">
          投稿內容
        </label>

        <textarea
          id="content"
          maxlength="2000"
          required
          placeholder="在這裡寫下你想分享的內容……"
        ></textarea>

        <div class="counter">
          <span id="count">0</span> / 2000 字
        </div>

        <div class="notice">
          🛡️ 投稿提醒：

          <br>・請勿填寫姓名、電話、住址等個人資訊。
          <br>・請勿發布威脅、騷擾或侵犯他人隱私的內容。
          <br>・投稿內容需要經過管理員人工審核。
          <br>・匿名投稿不代表可以免除法律責任。
        </div>

        <label class="check">
          <input type="checkbox" id="agree" required>
          <span>
            我已閱讀投稿提醒，並願意遵守平台規則。
          </span>
        </label>

        <button type="submit" id="submitBtn">
          確認投稿
        </button>

        <div id="message" role="status"></div>

      </form>

    </div>

    <footer>
      © 2026 NN匿名<br>
      獨立經營的匿名交流平台
    </footer>

  </div>

  <script>
    const content = document.getElementById("content");
    const count = document.getElementById("count");
    const form = document.getElementById("投稿表單");
    const message = document.getElementById("message");

    content.addEventListener("input", () => {
      count.textContent = content.value.length;
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      if (!content.value.trim()) {
        message.style.display = "block";
        message.textContent = "請先輸入投稿內容。";
        return;
      }

      message.style.display = "block";
      message.textContent =
        "目前投稿系統仍在建置中，這次沒有送出或儲存任何資料。請稍後再試。";
    });
  </script>

</body>
</html>
