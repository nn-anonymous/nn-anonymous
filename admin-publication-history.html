dth:100%;min-height:150px;resize:vertical;font-size:15px;line-height:1.65}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,455px),1fr));gap:16px;margin-top:18px}.post{padding:19px;border-radius:18px;background:#112044;border:1px solid #ffffff29;min-width:0}.post-top{display:flex;align-items:start;justify-content:space-between;gap:8px}.post-title{font-size:17px;font-weight:800}.pill{display:inline-flex;border:1px solid #6581b0;border-radius:30px;padding:2px 10px;color:#d6e6ff;font-size:12px;white-space:nowrap}.pill.live{border-color:#4eaf83;color:#a9f0d0}.post-content{white-space:pre-wrap;overflow-wrap:anywhere;border-left:3px solid #577cee;padding:8px 0 8px 13px;color:#f0f5ff;margin-top:13px;font-size:14px;max-height:200px;overflow:auto}.reply{color:#b5d5ff;border-left-color:#9e79ef}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}details{margin-top:16px;border-top:1px solid var(--line);padding-top:13px}summary{cursor:pointer;font-weight:750;color:#b8d4ff}label{display:block;margin:12px 0 5px;font-size:13px;font-weight:700}.helper{font-size:12px;color:#b7c9e8}.empty{padding:25px;text-align:center;color:var(--muted)}.activity{margin:0;padding-left:20px;font-size:13px;color:var(--muted)}.activity li{padding:5px 0}footer{text-align:center;color:#8aa2ca;font-size:12px;margin-top:45px}#workspace{display:none}#imageModal{display:none;position:fixed;inset:0;z-index:100;background:#000c;overflow:auto;padding:15px}#imageModal[aria-hidden=false]{display:flex;align-items:flex-start;justify-content:center}.modal-card{width:min(100%,600px);background:#102044;border:1px solid #678bc2;border-radius:18px;padding:16px;margin:20px auto}.modal-head{display:flex;gap:12px;align-items:center;justify-content:space-between}canvas{display:block;width:min(100%,420px);height:auto;margin:14px auto;box-shadow:0 8px 35px #0005}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;bo /* NN匿名 V1.4.1｜統一管理員文字分頁（手機可左右滑動） */

.nn-unified-nav .nn-tab[aria-current="page"]{color:#fff!important;font-weight:800}
.nn-unified-nav .nn-tab[aria-current="page"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:#8db4ff;border-radius:4px 4px 0 0;box-shadow:0 0 8px #8db4ff55}

/* NN匿名 V1.4.4：精簡、可展開的顯示設定，適合手機 */
.view-options{margin:12px 0 7px;border:1px solid #5274aa86;border-radius:12px;background:#10254a;overflow:hidden}
.view-options-toggle{display:flex;align-items:center;gap:8px;flex-wrap:wrap;cursor:pointer;list-style:none;margin:0;padding:9px 12px;min-height:44px;color:#e4eeff;font-weight:700;font-size:14px;line-height:1.4}
.view-options-toggle::-webkit-details-marker{display:none}
.view-options-toggle::after{content:'⌄';margin-left:auto;color:#aacbff;font-size:18px;line-height:1;transition:transform .16s}
.view-options[open] .view-options-toggle::after{transform:rotate(180deg)}
.view-options .setting-current{font-size:12px;color:#b4ccf5;font-weight:500;min-width:0;overflow-wrap:anywhere}
.view-options .display-settings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:10px 12px 12px;border-top:1px solid #5274aa60}

/* V1.4.4: 保證 Safari 收合時不顯示選項區，避免 CSS grid 覆蓋 details 預設樣式 */
.view-options:not([open]) > .display-settings { display: none !important; }
.view-options .setting{min-width:0}
.view-options .setting label{margin:0 0 4px;color:#d8e7ff;font-size:12px;line-height:1.4}
.view-options .setting select{display:block;width:100%;min-width:0;max-width:100%;height:40px;padding:7px 9px;font-size:13px;line-height:1.4;border-radius:9px}
.display-summary{font-size:12px;color:#aec8ef;margin:5px 0 12px;line-height:1.5}

 .view-options .display-settings{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:9px 11px 11px}

}

<main><p class="eyebrow">NN ANONYMOUS · ADMIN ONLY</p><h1>發布紀錄中心</h1><p class="muted">獨立查看網站與 IG 發布操作。僅限授權管理員；IG「已發布」為人工標記，並非 Instagram API 驗證結果。</p><div id="notice" class="notice" role="status">正在確認管理員身分……</div><section id="workspace"><div class="panel"><div class="history-actions"><a href="admin-publish.html">← 返回網站／IG 發布</a><select id="limit" aria-label="顯示筆數"><option value="20">最近 20 筆</option><option value="50" selected>最近 50 筆</option></select><select id="filter" aria-label="操作類別"><option value="all">全部操作</option><option value="web">網站操作</option><option value="ig">IG 操作</option></select><button id="refresh" type="button" class="primary">重新整理</button></div><p class="history-count" id="count" role="status"></p><ol id="history" class="history-list"></ol></div></section><footer>© 2026 NN匿名 · V1.5 更新中 · 管理員專用<br>本平台由黑熊工作室提供</footer></main>
<script type="module">import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
// 唯一放在瀏覽器中的只有 Supabase 公開 publishable key；不可放置 service_role 或 Secret Key。
const db=createClient('https://skasotsajckswovqhbeo.supabase.co','sb_publishable_k81-D28G-ipWmKVRwX2zpg_7y_xMvLX',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const $=id=>document.getElementById(id);
const names={'web.publish':'網站發布','web.hide':'網站下架','web.refresh':'網站內容更新','web.auto_hide':'自動下架','ig.draft':'IG 草稿已儲存','ig.ready':'IG 待發布','ig.posted':'IG 人工標記已發布'};
let rows=[],busy=false,authorized=false;
function el(tag,cls,text){const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node}
function notice(text){$('notice').textContent=text}
function lock(){authorized=false;rows=[];$('history').replaceChildren();$('workspace').style.display='none';notice('🔒 請先登入已授權的管理員帳號。');const link=el('a','',' 前往管理員登入');link.href='admin-login.html';$('notice').append(link)}
async function verify(){const{data,error}=await db.auth.getUser();if(error||!data?.user)throw Error('login');const result=await db.rpc('is_nn_admin');if(result.error||result.data!==true)throw Error('role');authorized=true;}
function render(){if(!authorized)return;const f=$('filter').value;const list=rows.filter(x=>f==='all'||String(x.action).startsWith(f+'.'));$('history').replaceChildren();$('count').textContent=`顯示 ${list.length} 筆（本次載入 ${rows.length} 筆近期紀錄，非全部歷史）`;if(!list.length){$('history').append(el('li','empty','目前沒有符合條件的發布紀錄。'));return}for(const x of list){const row=el('li','history-row');const id=el('strong','history-id','#NN匿名'+String(x.post_number).padStart(4,'0'));const action=el('span','history-action',names[x.action]||'其他操作');action.append(el('small','history-code',String(x.action)));const time=el('time','',new Date(x.created_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false}));row.append(id,action,time);$('history').append(row)}}
async function load(){if(busy)return;busy=true;$('refresh').disabled=true;$('limit').disabled=true;try{await verify();$('workspace').style.display='block';notice('正在讀取發布紀錄……');const{data,error}=await db.rpc('nn_recent_publication_activity',{p_limit:Number($('limit').value)});if(error)throw error;if(!authorized)return;rows=Array.isArray(data)?data:[];render();notice('✅ 管理員驗證成功。發布紀錄已更新（唯讀）。')}catch(e){if(e.message==='login'||e.message==='role'||e.code==='42501')lock();else{rows=[];$('history').replaceChildren();$('count').textContent='';notice('⚠️ 無法讀取發布紀錄，請重新整理或確認權限。')}}finally{busy=false;$('refresh').disabled=false;$('limit').disabled=false}}
$('refresh').addEventListener('click',load);$('limit').addEventListener('change',load);$('filter').addEventListener('change',render);db.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT')lock()});await load();
</script></body></html>
