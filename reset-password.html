
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080f26">
  <meta name="robots" content="noindex, nofollow">

  <title>設定管理員密碼｜NN匿名</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 25px 16px;
      font-family: -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC", sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 15% 15%,
          #243e86, transparent 40%),
        radial-gradient(circle at 85% 85%,
          #40266c, transparent 40%),
        #080f26;
    }

    .container {
      max-width: 440px;
      margin: 60px auto;
    }

    .back {
      display: inline-block;
      color: #a9caff;
      text-decoration: none;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .card {
      padding: 30px 24px;
      border: 1px solid #ffffff25;
      border-radius: 24px;
      background: #ffffff0d;
      box-shadow: 0 15px 50px #00000035;
    }

    .logo {
      color: #91b8ff;
      text-align: center;
      font-weight: 800;
      letter-spacing: 2px;
      font-size: 14px;
    }

    .symbol {
      width: 78px;
      height: 78px;
      margin: 24px auto;
      display: grid;
      place-items: center;
      border-radius: 23px;
      font-size: 27px;
      font-weight: 900;
      background: linear-gradient(
        135deg, #297dff, #7950e8);
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin: 12px 0;
    }

    p {
      text-align: center;
      color: #b5c4e3;
      font-size: 14px;
      line-height: 1.8;
    }

    label {
      display: block;
      margin: 22px 0 9px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #52658e;
      border-radius: 12px;
      background: #101d3b;
      color: white;
      font: inherit;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #80adff;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 16px;
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      background: linear-gradient(
        135deg, #297dff, #7950e8);
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #message {
      display: none;
      padding: 14px;
      margin-top: 20px;
      border-radius: 12px;
      background: #17294b;
      color: #c9dcff;
      font-size: 14px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    #message.success {
      background: #123d39;
      color: #b7f9de;
    }

    #message.error {
      background: #48232d;
      color: #ffd4da;
    }

    #newPasswordForm {
      display: none;
    }

    .hint {
      color: #9bb0d6;
      font-size: 12px;
      line-height: 1.8;
      margin-top: 10px;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      color: #899abb;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="container">
    <a class="back" href="admin-login.html">
      ← 返回管理員登入
    </a>

    <div class="card">

      <div class="logo">
        NN ANONYMOUS
      </div>

      <div class="symbol">NN</div>

      <h1>管理員密碼設定</h1>

      <p id="description">
        請輸入原本的管理員 Email，
        系統會寄送密碼設定信。
      </p>

      <form id="emailForm">

        <label for="email">
          管理員電子郵件
        </label>

        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="請輸入管理員 Email"
          required
        >

        <button type="submit" id="emailBtn">
          寄送密碼設定信
        </button>

      </form>

      <form id="newPasswordForm">

        <label for="password">
          新密碼
        </label>

        <input
          id="password"
          type="password"
          autocomplete="new-password"
          minlength="12"
          placeholder="至少 12 個字元"
          required
        >

        <label for="confirmPassword">
          確認新密碼
        </label>

        <input
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          minlength="12"
          placeholder="再次輸入新密碼"
          required
        >

        <div class="hint">
          建議使用至少 12 個字元，
          並避免與其他網站共用密碼。
        </div>

        <button type="submit" id="saveBtn">
          確認設定新密碼
        </button>

      </form>

      <div
        id="message"
        role="status"
        aria-live="polite"
      ></div>

    </div>

    <footer>
      © 2026 NN匿名<br>
      獨立經營的匿名交流平台
    </footer>
  </div>

  <script type="module">
    import { createClient } from
      "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL =
      "https://skasotsajckswovqhbeo.supabase.co";

    // 僅使用公開的 Publishable Key
    const SUPABASE_KEY =
      "sb_publishable_k81-D28G-ipWmKVRwX2zpg_7y_xMvLX";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
          flowType: "implicit"
        }
      }
    );

    const emailForm =
      document.getElementById("emailForm");

    const passwordForm =
      document.getElementById("newPasswordForm");

    const description =
      document.getElementById("description");

    const emailBtn =
      document.getElementById("emailBtn");

    const saveBtn =
      document.getElementById("saveBtn");

    const message =
      document.getElementById("message");

    let recoveryVerified = false;

    function showMessage(text, type = "") {
      message.style.display = "block";
      message.className = type;
      message.textContent = text;
    }

    // 收到有效的密碼重設登入事件
    supabase.auth.onAuthStateChange(
      (event, session) => {
        if (event === "PASSWORD_RECOVERY" && session) {
          recoveryVerified = true;
          emailForm.style.display = "none";
          passwordForm.style.display = "block";
          description.textContent =
            "驗證成功，請設定你的新密碼。";

          showMessage(
            "✅ 已驗證密碼重設連結。",
            "success"
          );
        }
      }
    );

    // 顯示失效或錯誤的重設連結提示
    const fragment = new URLSearchParams(
      window.location.hash.substring(1)
    );

    const search = new URLSearchParams(
      window.location.search
    );

    if (
      fragment.has("error") ||
      search.has("error")
    ) {
      showMessage(
        "重設連結已失效或無法使用，請重新申請。",
        "error"
      );
    }

    // 第一步：寄送密碼重設信
    emailForm.addEventListener(
      "submit",
      async (event) => {
        event.preventDefault();

        emailBtn.disabled = true;
        emailBtn.textContent = "寄送中……";

        try {
          // 使用目前網站的實際網址
          const redirectUrl =
            window.location.origin +
            window.location.pathname;

          const { error } =
            await supabase.auth.resetPasswordForEmail(
              document.getElementById("email")
                .value.trim(),
              {
                redirectTo: redirectUrl
              }
            );

          if (error) {
            showMessage(
              "目前無法寄送設定信，請確認 Email 或稍後再試。",
              "error"
            );
            return;
          }

          showMessage(
            "✅ 如果此 Email 已註冊且可接收重設信，請前往信箱查看。記得檢查垃圾郵件。",
            "success"
          );

        } catch (error) {
          console.error("寄信錯誤：", error);
          showMessage(
            "網路連線異常，請稍後再試。",
            "error"
          );

        } finally {
          emailBtn.disabled = false;
          emailBtn.textContent = "寄送密碼設定信";
        }
      }
    );

    // 第二步：更新管理員密碼
    passwordForm.addEventListener(
      "submit",
      async (event) => {
        event.preventDefault();

        if (!recoveryVerified) {
          showMessage(
            "請先從 Email 開啟有效的重設連結。",
            "error"
          );
          return;
        }

        const password =
          document.getElementById("password").value;

        const confirmPassword =
          document.getElementById("confirmPassword")
            .value;

        if (password.length < 12) {
          showMessage(
            "新密碼至少需要 12 個字元。",
            "error"
          );
          return;
        }

        if (password !== confirmPassword) {
          showMessage(
            "兩次輸入的密碼不相同。",
            "error"
          );
          return;
        }

        saveBtn.disabled = true;
        saveBtn.textContent = "設定中……";

        try {
          const { error } =
            await supabase.auth.updateUser({
              password
            });

          if (error) {
            showMessage(
              "密碼設定失敗，可能不符合密碼安全規則，請重新確認。",
              "error"
            );
            return;
          }

          recoveryVerified = false;
          passwordForm.style.display = "none";

          document.getElementById("password").value = "";
          document.getElementById("confirmPassword")
            .value = "";

          // 設定完成後登出重設用工作階段
          await supabase.auth.signOut();

          showMessage(
            "✅ 新密碼設定成功！請返回 NN匿名管理員登入頁面，使用新密碼登入。",
            "success"
          );

        } catch (error) {
          console.error("密碼更新錯誤：", error);
          showMessage(
            "目前無法完成密碼設定，請稍後再試。",
            "error"
          );

        } finally {
          saveBtn.disabled = false;
          saveBtn.textContent = "確認設定新密碼";
        }
      }
    );
  </script>

</body>
</html>
