
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NN匿名｜測試投稿</title>

  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js"
    async
    defer
  ></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont,
        "Noto Sans TC", sans-serif;
      color: #ffffff;
      background:
        radial-gradient(
          circle at 15% 15%,
          #243e86,
          transparent 40%
        ),
        #080f26;
    }

    main {
      max-width: 560px;
      margin: 50px auto;
    }

    .card {
      padding: 30px 22px;
      border: 1px solid #ffffff25;
      border-radius: 24px;
      background: #ffffff0d;
    }

    .logo {
      font-size: 17px;
      font-weight: 900;
      color: #91b8ff;
      letter-spacing: 1px;
    }

    h1 {
      font-size: 30px;
      margin: 20px 0 8px;
    }

    .muted {
      color: #b5c4e3;
      line-height: 1.8;
      font-size: 14px;
    }

    .notice {
      margin-top: 20px;
      padding: 15px;
      background: #1c3158;
      border-radius: 12px;
      color: #dce7ff;
      font-size: 14px;
      line-height: 1.8;
    }

    label {
      display: block;
      margin: 25px 0 10px;
      font-weight: 700;
    }

    textarea {
      width: 100%;
      min-height: 170px;
      padding: 16px;
      border: 1px solid #53658d;
      border-radius: 14px;
      background: #101c3b;
      color: #ffffff;
      font: inherit;
      resize: vertical;
    }

    textarea:focus {
      outline: 2px solid #528af1;
    }

    .count {
      text-align: right;
      color: #aab9d8;
      font-size: 12px;
      margin-top: 8px;
    }

    .verification {
      margin: 25px 0;
      min-height: 65px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(
        135deg,
        #297dff,
        #7950e8
      );
      color: white;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #result {
      margin-top: 18px;
      line-height: 1.7;
      min-height: 25px;
    }

    a {
      color: #a5c5ff;
    }

    footer {
      text-align: center;
      margin-top: 35px;
      color: #8799bb;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main>
    <section class="card">

      <div class="logo">
        NN ANONYMOUS · TEST
      </div>

      <h1>NN匿名｜測試投稿</h1>

      <p class="muted">
        你的想法，值得被聽見。
      </p>

     
<div class="notice">
  🛠 目前為測試環境。<br>
  正式投稿系統仍在維護中。<br>
  此頁用於測試真正的投稿功能。<br>
  測試內容會送入資料庫等待審核，不會自動公開。
</div>


      <form id="testForm">

        <label for="content">
          匿名投稿內容
        </label>

        <textarea
          id="content"
          maxlength="1000"
          required
          placeholder="請輸入測試文字，不要填寫真實個人資料。"
        ></textarea>

        <div class="count">
          <span id="count">0</span> / 1000 字
        </div>

        <div class="verification">

          <div
            class="cf-turnstile"
            data-sitekey="0x4AAAAAAGFnf3r2orE1Wvvf"
            data-callback="turnstileSuccess"
            data-expired-callback="turnstileExpired"
            data-error-callback="turnstileError"
          ></div>

        </div>

        <button
          id="submitButton"
          type="submit"
          disabled
        >
          完成驗證後測試提交
        </button>

        <p
          id="result"
          role="status"
          aria-live="polite"
        ></p>

      </form>

      <p class="muted">
        <a href="index.html">
          ← 返回 NN匿名首頁
        </a>
      </p>

    </section>

    <footer>
      © 2026 NN匿名｜獨立經營的匿名交流平台
    <div style="margin-top:8px;">本平台由黑熊工作室提供</div>
    </footer>
  </main>

  <script>
    const content = document.getElementById("content");
    const count = document.getElementById("count");
    const button = document.getElementById("submitButton");
    const result = document.getElementById("result");

    let verified = false;

    function updateButton() {
      button.disabled = !verified;
      button.textContent = verified
      ? "送出測試投稿（會儲存）"
        : "完成驗證後測試提交";
    }

    content.addEventListener("input", () => {
      count.textContent =
        Array.from(content.value).length;

      result.textContent = "";
    });

    window.turnstileSuccess = function(token) {
      verified = Boolean(token);
      updateButton();

      result.textContent = verified
        ? "✅ 驗證元件已完成，現在可以測試表單。"
        : "請完成機器人驗證。";
    };

    window.turnstileExpired = function() {
      verified = false;
      updateButton();

      result.textContent =
        "驗證已過期，請重新完成驗證。";
    };

    window.turnstileError = function() {
      verified = false;
      updateButton();

      result.textContent =
        "機器人驗證載入失敗，請稍後重試。";
    };

    document.getElementById("testForm")
      .addEventListener("submit", (event) => {

        event.preventDefault();

        if (!verified) {
          result.textContent =
            "請先完成機器人驗證。";
          return;
        }

        const message = content.value.trim();

        if (Array.from(message).length < 5) {
          result.textContent =
            "請至少輸入 5 個字。";
          return;
        }

        
const token = window.turnstile?.getResponse?.();

if (!token) {
  result.textContent = "驗證已失效，請重新驗證。";
  return;
}

button.disabled = true;
result.textContent = "正在送出測試投稿…";

fetch(
  "https://skasotsajckswovqhbeo.supabase.co/functions/v1/nn-submit-message",
  {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      content: message,
      turnstileToken: token
    })
  }
)
.then(async (response) => {
  const data = await response.json();

  if (!response.ok || data.success !== true) {
    throw new Error(data.message || "投稿失敗");
  }

  result.textContent =
    "✅ 測試投稿已成功存入待審核資料庫。";
})
.catch((error) => {
  result.textContent = "❌ " + error.message;
})
.finally(() => {
  verified = false;
  window.turnstile?.reset?.();
  updateButton();
});

      });
  </script>
</body>
</html>
