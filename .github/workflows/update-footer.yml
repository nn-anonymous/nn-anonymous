
name: NN匿名全站頁尾更新

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "選擇預覽或正式套用"
        required: true
        type: choice
        default: preview
        options:
          - preview
          - apply

permissions:
  contents: write

jobs:
  update-footer:
    runs-on: ubuntu-latest

    steps:
      - name: 取得網站程式碼
        uses: actions/checkout@v4

      - name: 預覽或更新網站頁尾
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          credit = "本平台由黑熊工作室提供"
          files = subprocess.check_output(
              ["git", "ls-files", "-z"]
          ).decode("utf-8").split("\0")
          changed = 0

          for name in files:
              if not name.lower().endswith(".html"):
                  continue
              path = Path(name)
              if not path.is_file():
                  continue

              original = path.read_text(
                  encoding="utf-8"
              )

              if credit in original:
                  print("已存在，跳過:", name)
                  continue

              footers = list(re.finditer(
                  r"</footer\s*>", original, re.I
              ))

              if footers:
                  pos = footers[-1].start()
                  markup = (
                      '<div style="margin-top:8px;">'
                      + credit + '</div>'
                  )
              else:
                  body = re.search(
                      r"</body\s*>", original, re.I
                  )
                  if body is None:
                      print("找不到頁尾位置，跳過:", name)
                      continue

                  pos = body.start()
                  markup = (
                      '<footer style="text-align:center;'
                      'padding:20px;color:#aab7ce;'
                      'font-size:14px;">'
                      + credit + '</footer>'
                  )

              line_start = (
                  original.rfind("\n", 0, pos) + 1
              )
              before_tag = original[line_start:pos]

              if before_tag.strip() == "":
                  updated = (
                      original[:line_start]
                      + before_tag
                      + markup
                      + "\n"
                      + original[line_start:]
                  )
              else:
                  updated = (
                      original[:pos]
                      + markup
                      + original[pos:]
                  )

              path.write_text(
                  updated, encoding="utf-8"
              )
              changed += 1
              print("預計修改:", name)

          print("本次修改檔案數:", changed)
          PY

          git diff --check
          git diff --stat -- '*.html'
          git diff -- '*.html'

          if [ "$MODE" = "apply" ]; then
            if ! git diff --quiet -- '*.html'; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -- '*.html'
              git commit -m "Add Black Bear Studio footer credit"
              git push origin HEAD:main
            else
              echo "所有網頁都已有提供單位文字，無須修改。"
            fi
          else
            echo "預覽完成：沒有提交或發布變更。"
          fi
